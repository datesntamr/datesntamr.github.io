<body>

    <a class="brand" href="/">

<main>

<div class="wrap section cart-page">
  <h1>سلة التسوق</h1>
  <div id="cartApp" class="checkout">
    <div class="col">
      <div id="cartItems" class="cart-items"><p class="muted">…</p></div>
    </div>
    <form id="checkout" class="col panel" novalidate hidden>
      <h2>التوصيل</h2>
      <label>الاسم *<input name="name" autocomplete="name" maxlength="100" required></label>
      <label>رقم الموبايل *<input name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="20" placeholder="01xxxxxxxxx" required></label>
      <label>البريد الإلكتروني <small class="muted">(اختياري)</small><input name="email" type="email" autocomplete="email" dir="ltr" maxlength="120"></label>
      <label>منطقة التوصيل *
        <select name="area" required id="areaSel"></select>
      </label>
      <label>العنوان بالتفصيل (الحي، الشارع، العمارة، الدور، الشقة) *<textarea name="address" rows="2" maxlength="300" autocomplete="street-address" required></textarea></label>
      <label>ملاحظات على الطلب<textarea name="notes" rows="2" maxlength="500" placeholder="أي طلبات خاصة؟"></textarea></label>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="pay"><input type="radio" checked disabled> الدفع عند الاستلام</div>
      <p class="muted small">🚚 خلال 7 - 10 أيام عمل</p>
      <dl class="totals">
        <dt data-t="subtotal"></dt><dd id="tSub"></dd>
        <dt data-t="delivery"></dt><dd id="tDel"></dd>
        <dt class="grand" data-t="total"></dt><dd class="grand" id="tTot"></dd>
      </dl>
      <p class="err" id="formErr" hidden></p>
      <div class="offline" id="offline" hidden></div>
      <button class="btn big full" type="submit" id="placeBtn"></button>
    </form>
  </div>
  <div id="done" class="panel done" hidden></div>
</div>
